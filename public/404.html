<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jensen Memorial</title>
    <script>
      // Redirect all GitHub Pages 404s back to index.html preserving the path.
      // pathSegmentsToKeep=1 because the site lives at /jensenmemorialgit/
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
